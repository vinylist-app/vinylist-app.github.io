# Publica la app en GitHub Pages cada vez que main cambia.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Ruta base de la app según el nombre del repositorio:
      # "usuario.github.io" u "organizacion.github.io" publica en la raíz (/);
      # cualquier otro nombre publica en /nombre-del-repo/.
      - name: Calcular la ruta base
        run: |
          case "$REPO_NAME" in
            *.github.io) echo "VITE_BASE=/" >> "$GITHUB_ENV" ;;
            *)           echo "VITE_BASE=/$REPO_NAME/" >> "$GITHUB_ENV" ;;
          esac
        env:
          REPO_NAME: ${{ github.event.repository.name }}
      - run: npm run build
      # Para que los enlaces directos (por ejemplo /album/…) abran la app y no un 404 de Pages.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
